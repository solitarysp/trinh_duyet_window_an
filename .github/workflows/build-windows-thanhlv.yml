name: Build Windows thanhlv

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore WebView2 SDK package
        run: nuget install Microsoft.Web.WebView2 -OutputDirectory packages

      - name: Configure (CMake)
        run: cmake -S . -B build -A x64 -DDEFAULT_URL="https://thanhlv.com"

      - name: Build (Release)
        run: cmake --build build --config Release -- /m

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HiddenBrowser-windows-x64
          path: build/Release/HiddenBrowser.exe
          if-no-files-found: error
